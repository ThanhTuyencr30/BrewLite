services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: brewlite
      POSTGRES_PASSWORD: change_this_local_password
      POSTGRES_DB: brewlite
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    name: brewlite-postgres-data